# Required GitHub Secrets:
# AZURE_CLIENT_ID            - App ID of the GitHub deployment service principal
# AZURE_TENANT_ID            - Entra ID Tenant ID
# AZURE_SUBSCRIPTION_ID      - Azure Subscription ID
# Note: OIDC Federated Credentials - no client secret needed
#
# Authentication: OIDC Federated Credentials (no secrets)
# Setup: Add federated credential in Entra ID for this repo/branch
# See: https://docs.github.com/en/actions/concepts/security/openid-connect
#
# CENTRAL_RESOURCE_GROUP     - Shared resource group (Plan, Cosmos, KV, Storage, AppInsights)
# APP_RESOURCE_GROUP         - App resource group (Web App, custom domain)
# APP_NAME                   - training-architect
# PLAN_NAME                  - plan-training-architect
# COSMOS_ACCOUNT_NAME        - cosmos-training-architect
# COSMOS_DATABASE_ID         - shared-content-db
# COSMOS_CONTAINER_NAME      - training-architect
# KEY_VAULT_NAME             - kv-training-architect
# CERT_NAME                  - training-architect
# TENANT_ID                  - Entra ID Tenant ID
# CLIENT_ID                  - training-architect App Registration Client ID
# STORAGE_ACCOUNT_NAME       - Azure Storage Account name
# APP_INSIGHTS_NAME          - Application Insights resource name
# LOG_ANALYTICS_NAME         - Log Analytics workspace name
# FOUNDRY_ACCOUNT_NAME       - Foundry account name (Microsoft.CognitiveServices/accounts)
# SITE_URL                   - Public site URL, e.g. https://www.example.com
# AUTHOR                     - Global author name used for HTML metadata
# MCP_ATHLETE_DATA_ENDPOINT  - Public MCP endpoint, e.g. https://intervals-mcp.training-architect.com/mcp
# FOUNDRY_PROJECT_ENDPOINT   - Foundry project endpoint for agent invocation
# FOUNDRY_PROJECT_AGENT_NAME - Foundry agent name for coaching calls
# Note: SYNCFUSION_LICENSE_KEY is stored in Key Vault, not passed as Bicep parameter
#
# Trigger: push to main when files in infra/ change
# Manual trigger: workflow_dispatch

name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infrastructure.yml'
  workflow_dispatch:

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Generate ARM parameter file
      run: |
        cat > infra/main.ci.parameters.json <<'JSON'
        {
          "$schema": "https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
          "contentVersion": "1.0.0.0",
          "parameters": {
            "centralResourceGroupName": { "value": ${{ toJson(secrets.CENTRAL_RESOURCE_GROUP) }} },
            "appResourceGroupName": { "value": ${{ toJson(secrets.APP_RESOURCE_GROUP) }} },
            "appName": { "value": ${{ toJson(secrets.APP_NAME) }} },
            "planName": { "value": ${{ toJson(secrets.PLAN_NAME) }} },
            "cosmosAccountName": { "value": ${{ toJson(secrets.COSMOS_ACCOUNT_NAME) }} },
            "cosmosDatabaseId": { "value": ${{ toJson(secrets.COSMOS_DATABASE_ID) }} },
            "cosmosContainerName": { "value": ${{ toJson(secrets.COSMOS_CONTAINER_NAME) }} },
            "keyVaultName": { "value": ${{ toJson(secrets.KEY_VAULT_NAME) }} },
            "keyVaultCertificateName": { "value": ${{ toJson(secrets.CERT_NAME) }} },
            "tenantId": { "value": ${{ toJson(secrets.TENANT_ID) }} },
            "clientId": { "value": ${{ toJson(secrets.CLIENT_ID) }} },
            "storageAccountName": { "value": ${{ toJson(secrets.STORAGE_ACCOUNT_NAME) }} },
            "appInsightsName": { "value": ${{ toJson(secrets.APP_INSIGHTS_NAME) }} },
            "foundryAccountName": { "value": ${{ toJson(secrets['FOUNDRY_ACCOUNT_NAME']) }} },
            "siteUrl": { "value": ${{ toJson(secrets.SITE_URL) }} },
            "author": { "value": ${{ toJson(secrets.AUTHOR) }} },
            "mcpAthleteDataEndpoint": { "value": ${{ toJson(secrets.MCP_ATHLETE_DATA_ENDPOINT) }} },
            "foundryProjectEndpoint": { "value": ${{ toJson(secrets['FOUNDRY_PROJECT_ENDPOINT']) }} },
            "foundryProjectAgentName": { "value": ${{ toJson(secrets['FOUNDRY_PROJECT_AGENT_NAME']) }} }
          }
        }
        JSON

    - name: Deploy Bicep template
      uses: azure/arm-deploy@v2
      with:
        scope: subscription
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        region: germanywestcentral
        template: infra/main.bicep
        parameters: infra/main.ci.parameters.json
        failOnStdErr: false

    - name: Azure Logout
      run: az logout
      if: always()
